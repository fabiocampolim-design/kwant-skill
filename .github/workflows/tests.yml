name: tests

on:
  push:
  pull_request:

jobs:
  static:
    # No Kwant needed. pyflakes over the WHOLE tree first (publishing playbook
    # rule 5), then the invariants of the shipped notebooks and documents:
    # kernel name, zero error outputs, cell/figure counts, 25 exercises matched
    # 1:1 to solutions, no personal data, licence texts + SPDX headers,
    # withheld-material guard, docs<->CLI guard, manual readback.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pytest pyflakes pymupdf
      - name: pyflakes (whole tree, before the suite)
        run: python -m pyflakes verify_kwant.py test_thread_safety.py tests dev docs
      - name: Notebook, licence, held-material and documentation invariants
        run: python -m pytest tests/test_notebooks.py tests/test_license.py tests/test_no_held_material.py tests/test_manual_readback.py -q

  kwant:
    # Real Kwant from conda-forge (with MUMPS), the two support scripts through
    # their CLIs, and both notebooks executed from a cold kernel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: kwant
          python-version: "3.13"
          channels: conda-forge
          channel-priority: strict
      - name: Install Kwant stack (same pins as install_kwant_windows.ps1)
        run: |
          conda install -y -c conda-forge --override-channels \
            kwant "numpy<2.5" scipy matplotlib sympy python-mumps \
            ipykernel jupyterlab nbconvert pytest pyflakes
          python -m ipykernel install --user --name kwant --display-name "Python (kwant)"
      - name: pyflakes (whole tree, before the suite)
        run: python -m pyflakes verify_kwant.py test_thread_safety.py tests dev docs
      - name: verify_kwant.py
        run: python verify_kwant.py --outdir ci-out --json
      - name: test_thread_safety.py (safe path; canary in a subprocess)
        run: python test_thread_safety.py --outdir ci-out --json
      - name: Script CLI contract, docs<->CLI guard, notebook invariants
        run: python -m pytest tests -q
      - name: Execute both notebooks from a cold kernel
        env:
          KWANT_NB_EXECUTE: "1"
        run: python -m pytest tests/test_execute_notebooks.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: ci-out
